services:
  - type: web
    name: telegram-storybot-free
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: Pocketdownbot
      - key: TELEGRAM_OWNER_ID
        value: "1000931167"
      - key: TELEGRAM_OWNER_USERNAME
        value: toonworldvsm2
      - key: TELEGRAM_ADMIN_IDS
        value: "1000931167,5115013713"
      - key: DATABASE_URL
        fromDatabase:
          name: telegramstorybot-free-db
          property: connectionString
      - key: JPA_DDL_AUTO
        value: update
      - key: GROQ_INTENT_ENABLED
        value: "false"
      - key: GROQ_EPISODE_DETECTION_ENABLED
        value: "false"
