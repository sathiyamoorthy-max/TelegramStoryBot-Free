spring.application.name=storybot-free
app.environment=render

server.port=${PORT:10000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.owner.id=${TELEGRAM_OWNER_ID}
telegram.owner.username=${TELEGRAM_OWNER_USERNAME}
telegram.admin.ids=${TELEGRAM_ADMIN_IDS:}

groq.api.key=${GROQ_API_KEY:}
groq.url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.intent.enabled=${GROQ_INTENT_ENABLED:false}
groq.episode-detection.enabled=${GROQ_EPISODE_DETECTION_ENABLED:false}

reward.trial.enabled=false
reward.trial.provider-approved=false
