spring.application.name=storybot-free
app.environment=render

server.port=${PORT:10000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.owner.id=${TELEGRAM_OWNER_ID:1000931167}
telegram.owner.username=${TELEGRAM_OWNER_USERNAME:toonworldvsm2}

groq.api.key=${GROQ_API_KEY:}
groq.url=${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.intent.enabled=${GROQ_INTENT_ENABLED:false}
groq.episode-detection.enabled=${GROQ_EPISODE_DETECTION_ENABLED:false}

reward.trial.enabled=${REWARD_TRIAL_ENABLED:false}
reward.trial.provider-approved=${REWARD_TRIAL_PROVIDER_APPROVED:false}
reward.trial.link-providers=${REWARD_LINK_PROVIDERS:ALL}

reward.trial.shrtfly.api-url=${SHRTFLY_API_URL:https://shrtfly.com/api}
reward.trial.shrtfly.api-keys=${SHRTFLY_API_KEYS:}
reward.trial.shrtfly.link-type=${SHRTFLY_LINK_TYPE:1}

reward.trial.liteshort.api-url=${LITESHORT_API_URL:https://liteshort.com/api/}
reward.trial.liteshort.api-keys=${LITESHORT_API_KEYS:}
reward.trial.liteshort.api-key-param=${LITESHORT_API_KEY_PARAM:api}
reward.trial.liteshort.url-param=${LITESHORT_URL_PARAM:url}
